name: ATS Mini OS - First Compile (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: esp32s3-ospi
            psram: opi
          - profile: esp32s3-qspi
            psram: enabled
    name: Compile-only / ${{ matrix.profile }}
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Free disk space for ESP32 platform packages
        run: |
          # ESP32 core installation unpacks libraries for several chip families.
          # Remove unrelated preinstalled SDKs from this ephemeral runner only.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift
          df -h /

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.4.1

      - name: Configure ESP32 package index
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12

      - name: Install SI4735 tuner library
        env:
          ARDUINO_LIBRARY_ENABLE_UNSAFE_INSTALL: "true"
        run: arduino-cli lib install --git-url https://github.com/pu2clr/SI4735

      - name: Install LovyanGFX display library
        env:
          ARDUINO_LIBRARY_ENABLE_UNSAFE_INSTALL: "true"
        run: arduino-cli lib install --git-url https://github.com/lovyan03/LovyanGFX

      - name: Verify LovyanGFX installation
        run: |
          arduino-cli lib list
          LGFX_LIB="$HOME/Arduino/libraries/LovyanGFX"
          test -f "$LGFX_LIB/library.properties"
          test -f "$LGFX_LIB/src/LovyanGFX.hpp" || test -f "$LGFX_LIB/src/LovyanGFX.h"
          echo "Found LovyanGFX header at $LGFX_LIB/src"

      - name: Verify SI4735 header was installed
        run: |
          arduino-cli lib list
          SI4735_LIB="$HOME/Arduino/libraries/PU2CLR_SI4735"
          test -f "$SI4735_LIB/library.properties"
          test -f "$SI4735_LIB/src/SI4735.h"
          test -f "$SI4735_LIB/src/SI4735.cpp"
          echo "Found SI4735 library metadata, header, and implementation:"
          echo "$SI4735_LIB/library.properties"
          echo "$SI4735_LIB/src/SI4735.h"
          echo "$SI4735_LIB/src/SI4735.cpp"
          arduino-cli lib list "PU2CLR SI4735"

      - name: Verify ESP32-S3 target is available
        run: arduino-cli board details -b esp32:esp32:esp32s3

      - name: Stage third-party implementations in sketch source tree
        run: |
          # The current CLI report resolves LovyanGFX headers but omits LovyanGFX
          # from the compiled-library list, leaving its methods undefined at link time.
          # Stage upstream source files under the sketch's recursive src tree so
          # Arduino CLI compiles them as ordinary sketch sources.
          mkdir -p firmware/ats-mini-os/src/vendor/LovyanGFX
          cp -R "$HOME/Arduino/libraries/LovyanGFX/src/." firmware/ats-mini-os/src/vendor/LovyanGFX/
          cp "$HOME/Arduino/libraries/PU2CLR_SI4735/src/SI4735.cpp" firmware/ats-mini-os/src/vendor/SI4735Library.cpp
          test -f firmware/ats-mini-os/src/vendor/LovyanGFX/LovyanGFX.hpp
          test -s firmware/ats-mini-os/src/vendor/SI4735Library.cpp
          echo "Staged LovyanGFX and SI4735 implementations into sketch src tree."

      - name: Compile ATS Mini OS scaffold
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=8M,PSRAM=${{ matrix.psram }},CPUFreq=80,USBMode=hwcdc,FlashMode=qio,PartitionScheme=custom,DebugLevel=none" \
            --warnings all \
            --libraries "$HOME/Arduino/libraries" \
            --build-property "compiler.cpp.extra_flags=-Ifirmware/ats-mini-os/src/vendor/LovyanGFX -Ifirmware/ats-mini-os/src/vendor/LovyanGFX/lgfx -I$HOME/Arduino/libraries/PU2CLR_SI4735/src" \
            firmware/ats-mini-os

      - name: Preserve compile report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ats-mini-os-compile-report-${{ matrix.profile }}
          path: |
            build
            firmware/ats-mini-os
          if-no-files-found: warn
          retention-days: 14
