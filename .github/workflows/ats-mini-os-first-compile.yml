name: ATS Mini OS - First Compile (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: esp32s3-ospi
            label: OSPI-DE
            psram: opi
          - profile: esp32s3-qspi
            label: QSPI-DE
            psram: enabled
    name: Compile-only / ${{ matrix.profile }}
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Free disk space for ESP32 platform packages
        run: |
          # ESP32 core installation unpacks libraries for several chip families.
          # Remove unrelated preinstalled SDKs from this ephemeral runner only.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift
          df -h /

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.4.1

      - name: Configure ESP32 package index
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12

      - name: Install SI4735 tuner library
        env:
          ARDUINO_LIBRARY_ENABLE_UNSAFE_INSTALL: "true"
        run: arduino-cli lib install --git-url https://github.com/pu2clr/SI4735

      - name: Install LovyanGFX display library
        env:
          ARDUINO_LIBRARY_ENABLE_UNSAFE_INSTALL: "true"
        run: arduino-cli lib install --git-url https://github.com/lovyan03/LovyanGFX

      - name: Verify LovyanGFX installation
        run: |
          arduino-cli lib list
          LGFX_LIB="$HOME/Arduino/libraries/LovyanGFX"
          test -f "$LGFX_LIB/library.properties"
          test -f "$LGFX_LIB/src/LovyanGFX.hpp" || test -f "$LGFX_LIB/src/LovyanGFX.h"
          echo "Found LovyanGFX header at $LGFX_LIB/src"

      - name: Verify SI4735 header was installed
        run: |
          arduino-cli lib list
          SI4735_LIB="$HOME/Arduino/libraries/PU2CLR_SI4735"
          test -f "$SI4735_LIB/library.properties"
          test -f "$SI4735_LIB/src/SI4735.h"
          test -f "$SI4735_LIB/src/SI4735.cpp"
          echo "Found SI4735 library metadata, header, and implementation:"
          echo "$SI4735_LIB/library.properties"
          echo "$SI4735_LIB/src/SI4735.h"
          echo "$SI4735_LIB/src/SI4735.cpp"
          arduino-cli lib list "PU2CLR SI4735"

      - name: Verify ESP32-S3 target is available
        run: arduino-cli board details -b esp32:esp32:esp32s3

      - name: Stage third-party implementations in sketch source tree
        run: |
          # The current CLI report resolves LovyanGFX headers but omits LovyanGFX
          # from the compiled-library list, leaving its methods undefined at link time.
          # Stage upstream source files under the sketch's recursive src tree so
          # Arduino CLI compiles them as ordinary sketch sources.
          mkdir -p firmware/ats-mini-os/src/vendor/LovyanGFX
          cp -R "$HOME/Arduino/libraries/LovyanGFX/src/." firmware/ats-mini-os/src/vendor/LovyanGFX/
          cp "$HOME/Arduino/libraries/PU2CLR_SI4735/src/SI4735.cpp" firmware/ats-mini-os/src/vendor/SI4735Library.cpp
          # Upstream getRdsDateTime() ORs the MJD bitfield into an uninitialized
          # integer. Initialize date fields in this staged copy to remove UB and
          # the compiler warning without changing the installed upstream library.
          sed -i 's/uint32_t mjd, day, month, year;/uint32_t mjd = 0, day = 0, month = 0, year = 0;/' firmware/ats-mini-os/src/vendor/SI4735Library.cpp
          grep -F 'uint32_t mjd = 0, day = 0, month = 0, year = 0;' firmware/ats-mini-os/src/vendor/SI4735Library.cpp
          test -f firmware/ats-mini-os/src/vendor/LovyanGFX/LovyanGFX.hpp
          test -f firmware/ats-mini-os/src/vendor/LovyanGFX/lgfx/v1/LGFX_Sprite.inl
          echo "Verified LGFX_Sprite.inl at firmware/ats-mini-os/src/vendor/LovyanGFX/lgfx/v1/LGFX_Sprite.inl"
          test -s firmware/ats-mini-os/src/vendor/SI4735Library.cpp
          echo "Staged LovyanGFX and SI4735 implementations into sketch src tree."

      - name: Compile ATS Mini OS scaffold
        run: |
          set -o pipefail
          mkdir -p "build/${{ matrix.profile }}"
          arduino-cli compile \
            --output-dir "build/${{ matrix.profile }}" \
            --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=8M,PSRAM=${{ matrix.psram }},CPUFreq=80,USBMode=hwcdc,FlashMode=qio,PartitionScheme=custom,DebugLevel=none" \
            --warnings all \
            --libraries "$HOME/Arduino/libraries" \
            --build-property "compiler.cpp.extra_flags=-Ifirmware/ats-mini-os/src/vendor/LovyanGFX -Ifirmware/ats-mini-os/src/vendor/LovyanGFX/lgfx -Ifirmware/ats-mini-os/src/vendor/LovyanGFX/lgfx/v1 -I$HOME/Arduino/libraries/PU2CLR_SI4735/src" \
            firmware/ats-mini-os 2>&1 | tee "build/${{ matrix.profile }}/COMPILE-LOG.txt"

      - name: Prepare named firmware and source artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="release-artifacts/${{ matrix.profile }}"
          mkdir -p "$OUT"
          PROFILE="${{ matrix.profile }}"
          if [ "$PROFILE" = "esp32s3-ospi" ]; then
            LABEL="OSPI-DE"
          else
            LABEL="QSPI-DE"
          fi

          # Arduino CLI may place ESP32-S3 outputs in a nested FQBN directory.
          # Discover the real output path instead of assuming it is directly under build/$PROFILE.
          APP_BIN="$(find "build/$PROFILE" -type f -name 'ats-mini-os.ino.bin' -print -quit)"
          if [ -n "$APP_BIN" ] && [ -s "$APP_BIN" ]; then
            cp "$APP_BIN" "$OUT/ATS-Mini-OS-$LABEL.ino.bin"
          else
            echo "Expected application binary missing under build/$PROFILE" >&2
            find "build/$PROFILE" -maxdepth 5 -type f -print || true
            echo "Firmware binary was not produced; see COMPILE-LOG.txt." > "$OUT/NO-FIRMWARE-BINARY.txt"
          fi
          # The source directory itself is uploaded as a GitHub artifact below.
          # GitHub creates the downloadable ZIP, so do not create a nested source ZIP here.

          # Preserve diagnostic output even when compilation failed before creating a binary.
          if [ -s "build/$PROFILE/COMPILE-LOG.txt" ]; then
            cp "build/$PROFILE/COMPILE-LOG.txt" "$OUT/COMPILE-LOG.txt"
          else
            printf 'Compile log was not created. Check the workflow steps above for the failure.\n' > "$OUT/COMPILE-LOG.txt"
          fi

          {
            echo "Profile: $PROFILE"
            echo "Label: $LABEL"
            echo "Application binary: ATS-Mini-OS-$LABEL.ino.bin (only present if compilation produced it)"
            echo "FlashSize: 8M"
            echo "ESP32 Arduino core: 3.3.12"
            echo "PSRAM mode: ${{ matrix.psram }}"
            echo "Third-party implementation sources are staged into the source artifact from the installed libraries used by this build."
            echo "This ZIP does not include the complete offline toolchain."
            echo "Compile success is not hardware or partition compatibility validation."
            echo "OTA package intentionally not emitted until OTA/partition compatibility is verified."
          } > "$OUT/BUILD-NOTES.txt"

          # Assemble a review-only bundle from the actual nested build output.
          # This is NOT an approved flashing package.
          FLASH_REVIEW="$OUT/FIRST-FLASH-REVIEW-ONLY"
          mkdir -p "$FLASH_REVIEW"
          # Arduino CLI --output-dir outputs and the sketch-local build cache can
          # live in different roots. Search both; do not silently miss flash_args.
          BUILD_ROOT="build/$PROFILE"
          SKETCH_BUILD_ROOT="firmware/ats-mini-os/build"

          # Copy actual outputs generated by Arduino CLI / ESP32 core.
          for file in \
            "ats-mini-os.ino.bin" \
            "ats-mini-os.ino.merged.bin" \
            "ats-mini-os.ino.bootloader.bin" \
            "ats-mini-os.ino.partitions.bin" \
            "boot_app0.bin" \
            "flash_args" \
            "partitions.csv"; do
            source_file=""
            for search_root in "$BUILD_ROOT" "$SKETCH_BUILD_ROOT"; do
              if [ -d "$search_root" ]; then
                source_file="$(find "$search_root" -type f -name "$file" -print -quit)"
                [ -z "$source_file" ] || break
              fi
            done
            if [ -n "$source_file" ] && [ -s "$source_file" ]; then
              cp "$source_file" "$FLASH_REVIEW/"
              echo "Review bundle: copied $file from $source_file"
            else
              echo "Review bundle: build output does not contain $file"
            fi
          done

          # Keep the real generated flash_args visible, but flag a profile mismatch.
          # This workflow currently requests FlashMode=qio; never approve a bundle
          # if the generated flash_args says another mode.
          if [ -s "$FLASH_REVIEW/flash_args" ]; then
            if grep -Eq -- '--flash-mode[[:space:]]+qio([[:space:]]|$)' "$FLASH_REVIEW/flash_args"; then
              FLASH_MODE_STATUS="PASS: generated flash_args declares qio, matching the requested profile."
            else
              FLASH_MODE_STATUS="FAIL: generated flash_args flash mode does not match requested FlashMode=qio; investigate before any flash."
            fi
          else
            FLASH_MODE_STATUS="FAIL: generated flash_args is missing."
          fi

          # partitions.csv is a sketch-level configuration file in this project;
          # include it directly if the core's generated build directory omitted it.
          if [ ! -s "$FLASH_REVIEW/partitions.csv" ] && [ -s "firmware/ats-mini-os/partitions.csv" ]; then
            cp "firmware/ats-mini-os/partitions.csv" "$FLASH_REVIEW/partitions.csv"
            echo "Review bundle: included sketch partitions.csv as reference."
          fi

          # boot_app0.bin belongs to the installed ESP32 core, not necessarily
          # the sketch output directory. Find it in the exact installed core version.
          if [ ! -s "$FLASH_REVIEW/boot_app0.bin" ]; then
            BOOT_APP0="$(find "$HOME/.arduino15/packages/esp32" -type f -name boot_app0.bin -print -quit 2>/dev/null || true)"
            if [ -n "$BOOT_APP0" ] && [ -s "$BOOT_APP0" ]; then
              cp "$BOOT_APP0" "$FLASH_REVIEW/boot_app0.bin"
              echo "Review bundle: included core boot_app0.bin from $BOOT_APP0"
            fi
          fi

          # Record the known ATS-Mini-Dev reference layout explicitly, and validate
          # the sketch partition CSV. The generated flash_args is copied separately
          # when found; reference offsets are never a substitute for that file.
          EXPECTED_PARTITIONS="$(mktemp)"
          cat > "$EXPECTED_PARTITIONS" <<'EOF'
          nvs,data,nvs,0x9000,0x5000
          otadata,data,ota,0xe000,0x2000
          app0,app,ota_0,0x10000,0x300000
          app1,app,ota_1,0x310000,0x300000
          littlefs,data,littlefs,0x610000,0x1d0000
          settings,data,nvs,0x7e0000,0x10000
          coredump,data,coredump,0x7f0000,0x10000
          EOF
          ACTUAL_PARTITIONS="$(mktemp)"
          awk -F, '!/^#/ && NF >= 5 {
            for (i=1;i<=5;i++) { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $i) }
            print $1 "," $2 "," $3 "," tolower($4) "," tolower($5)
          }' firmware/ats-mini-os/partitions.csv > "$ACTUAL_PARTITIONS"

          if diff -u "$EXPECTED_PARTITIONS" "$ACTUAL_PARTITIONS" > "$FLASH_REVIEW/PARTITION-CHECK.diff"; then
            PARTITION_STATUS="PASS: sketch partition table matches the checked-in ATS-Mini-Dev reference layout."
          else
            PARTITION_STATUS="FAIL: sketch partition table differs from the ATS-Mini-Dev reference. Do not flash."
          fi

          {
            echo "FLASH ADDRESS REVIEW - REFERENCE ONLY"
            echo "Profile: $LABEL"
            echo "Flash size profile: 8M"
            echo
            echo "Known-good ATS-Mini-Dev reference addresses:"
            echo "0x0000  ats-mini-os.ino.bootloader.bin"
            echo "0x8000  ats-mini-os.ino.partitions.bin"
            echo "0xE000  boot_app0.bin"
            echo "0x10000 ats-mini-os.ino.bin (application image)"
            echo
            echo "Alternative single-image method:"
            echo "0x0000  ats-mini-os.ino.merged.bin"
            echo
            echo "$PARTITION_STATUS"
            echo "$FLASH_MODE_STATUS"
            echo
            echo "IMPORTANT: these are reference offsets; consult the included generated flash_args where present."
            echo "The merged image and the separate-file method are alternatives; never use both."
            echo "This review does not verify bootloader/Dual Boot compatibility or authorize flashing."
          } > "$FLASH_REVIEW/FLASH-ADDRESSES.txt"
          rm -f "$EXPECTED_PARTITIONS" "$ACTUAL_PARTITIONS"

          # Write the safety note first, then append missing-file diagnostics.
          cat > "$FLASH_REVIEW/README-FIRST-FLASH-REVIEW.txt" <<EOF
          ATS Mini OS - FIRST FLASH REVIEW ONLY
          Profile: $LABEL
          FlashSize: 8M
          ESP32 Arduino core: 3.3.12
          PSRAM mode: ${{ matrix.psram }}

          SAFETY: DO NOT FLASH THIS BUNDLE YET.
          This bundle is for inspecting actual generated outputs and flash arguments.
          The merged image can include bootloader and partition data and may overwrite
          an existing Dual Boot setup. Confirm offsets, partitions, bootloader and method
          against the known-good ATS-Mini-Dev configuration and the user's backup.
          No device write is performed by this workflow.
          EOF

          for required in "ats-mini-os.ino.bin" "ats-mini-os.ino.bootloader.bin" "ats-mini-os.ino.partitions.bin" "boot_app0.bin" "flash_args" "partitions.csv"; do
            if [ ! -s "$FLASH_REVIEW/$required" ]; then
              echo "MISSING from review bundle: $required" >> "$FLASH_REVIEW/README-FIRST-FLASH-REVIEW.txt"
            fi
          done
          {
            echo "FIRST-FLASH STATUS: NOT APPROVED"
            echo "Profile: $LABEL"
            if [ -s "$FLASH_REVIEW/flash_args" ]; then
              echo "flash_args: included from actual build output"
              echo "flash_args mode line: $(head -n 1 "$FLASH_REVIEW/flash_args")"
            else
              echo "flash_args: not found in searched build output locations"
            fi
            echo "$FLASH_MODE_STATUS"
            echo "Bootloader/Dual Boot compatibility: not independently verified"
            echo "Partition layout: checked against the project's checked-in reference only"
            echo "Hardware validation: not performed"
            echo "Next step: inspect this bundle and compare against the user's known-good backup and reference firmware before any device write."
            echo "Do not flash this bundle yet."
          } > "$FLASH_REVIEW/FLASH-STATUS.txt"
          # Make the review bundle auditable without implying flash approval.
          (
            cd "$FLASH_REVIEW"
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
              | sort -z \
              | xargs -0 -r sha256sum
          ) > "$FLASH_REVIEW/SHA256SUMS.txt"
      - name: Upload first-flash review bundle (not for flashing yet)
        if: always() && hashFiles(format('release-artifacts/{0}/FIRST-FLASH-REVIEW-ONLY/*', matrix.profile)) != ''
        uses: actions/upload-artifact@v4
        with:
          name: ATS-Mini-OS-${{ matrix.label }}-FIRST-FLASH-REVIEW-ONLY
          path: release-artifacts/${{ matrix.profile }}/FIRST-FLASH-REVIEW-ONLY/
          if-no-files-found: error
          retention-days: 14

      - name: Upload firmware binary separately
        if: always() && hashFiles(format('release-artifacts/{0}/*.ino.bin', matrix.profile)) != ''
        uses: actions/upload-artifact@v4
        with:
          name: ATS-Mini-OS-${{ matrix.label }}-Firmware-BIN
          path: release-artifacts/${{ matrix.profile }}/*.ino.bin
          if-no-files-found: error
          retention-days: 14

      - name: Prepare sanitized source artifact
        if: always() && hashFiles('firmware/ats-mini-os/ats-mini-os.ino') != ''
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ROOT="release-artifacts/source-code/firmware/ats-mini-os"
          mkdir -p "$SOURCE_ROOT"
          cp -R firmware/ats-mini-os/. "$SOURCE_ROOT/"
          # Build output/cache is not source code and can contain large binaries,
          # ELF/map files and flash_args; keep those only in the dedicated review bundle.
          rm -rf "$SOURCE_ROOT/build"
          # Keep the private working branch's test configuration untouched,
          # but never package its hotspot SSID/password in downloadable artifacts.
          cat > "$SOURCE_ROOT/src/network/WifiTestConfig.h" <<'EOF'
          #pragma once

          // Sanitized artifact copy. Add local test credentials only on your own device.
          // The private development branch retains its own local test configuration.
          namespace WifiTestConfig {
          constexpr char SSID[] = "";
          constexpr char PASSWORD[] = "";
          }  // namespace WifiTestConfig
          EOF
          test -f "$SOURCE_ROOT/src/network/WifiTestConfig.h"
          grep -F 'constexpr char SSID[] = "";' "$SOURCE_ROOT/src/network/WifiTestConfig.h"
          grep -F 'constexpr char PASSWORD[] = "";' "$SOURCE_ROOT/src/network/WifiTestConfig.h"
          if grep -R -n -E 'S22|12345678' "$SOURCE_ROOT/src/network/WifiTestConfig.h"; then
            echo "Unexpected private test credential found in sanitized source artifact." >&2
            exit 1
          fi

      - name: Upload source tree separately
        if: always() && hashFiles('release-artifacts/source-code/firmware/ats-mini-os/ats-mini-os.ino') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ATS-Mini-OS-Source-Code-${{ matrix.label }}
          path: release-artifacts/source-code/firmware/ats-mini-os/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload compile log separately
        if: always() && hashFiles(format('release-artifacts/{0}/COMPILE-LOG.txt', matrix.profile)) != ''
        uses: actions/upload-artifact@v4
        with:
          name: ATS-Mini-OS-${{ matrix.label }}-COMPILE-LOG
          path: release-artifacts/${{ matrix.profile }}/COMPILE-LOG.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload build notes separately
        if: always() && hashFiles(format('release-artifacts/{0}/BUILD-NOTES.txt', matrix.profile)) != ''
        uses: actions/upload-artifact@v4
        with:
          name: ATS-Mini-OS-${{ matrix.label }}-BUILD-NOTES
          path: release-artifacts/${{ matrix.profile }}/BUILD-NOTES.txt
          if-no-files-found: error
          retention-days: 14
